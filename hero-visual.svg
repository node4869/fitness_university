<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280">
  <defs>
    <linearGradient id="hBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#162b3e"/>
    </linearGradient>
    <radialGradient id="hGR" cx="72%" cy="50%">
      <stop offset="0%" stop-color="#6da88f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6da88f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hGL" cx="20%" cy="50%">
      <stop offset="0%" stop-color="#3e6ea8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3e6ea8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3e6ea8" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#6da88f" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#6da88f"/>
    </linearGradient>
    <filter id="hGF">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" fill="url(#hBg)"/>
  <rect width="800" height="280" fill="url(#hGR)"/>
  <rect width="800" height="280" fill="url(#hGL)"/>

  <!-- Subtle grid -->
  <g stroke="white" stroke-width="0.3" opacity="0.035">
    <line x1="0" y1="70" x2="800" y2="70"/>
    <line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="0" y1="210" x2="800" y2="210"/>
    <line x1="160" y1="0" x2="160" y2="280"/>
    <line x1="320" y1="0" x2="320" y2="280"/>
    <line x1="480" y1="0" x2="480" y2="280"/>
    <line x1="640" y1="0" x2="640" y2="280"/>
  </g>

  <!-- ===LEFT: Confusion zone=== -->
  <circle cx="165" cy="140" r="105" fill="rgba(62,110,168,0.04)" stroke="#3e6ea8" stroke-width="0.8" stroke-dasharray="5,8" opacity="0.22"/>

  <!-- Scattered nodes -->
  <circle cx="98" cy="75" r="5" fill="#3e6ea8" opacity="0.62"/>
  <circle cx="155" cy="55" r="4" fill="#b8d4e8" opacity="0.5"/>
  <circle cx="218" cy="80" r="6" fill="#3e6ea8" opacity="0.55"/>
  <circle cx="78" cy="130" r="4" fill="#b8d4e8" opacity="0.45"/>
  <circle cx="138" cy="115" r="5" fill="#3e6ea8" opacity="0.5"/>
  <circle cx="208" cy="130" r="4" fill="#b8d4e8" opacity="0.5"/>
  <circle cx="112" cy="180" r="6" fill="#3e6ea8" opacity="0.55"/>
  <circle cx="175" cy="196" r="4" fill="#b8d4e8" opacity="0.4"/>
  <circle cx="222" cy="168" r="5" fill="#3e6ea8" opacity="0.48"/>
  <circle cx="92" cy="218" r="3" fill="#b8d4e8" opacity="0.3"/>

  <!-- Chaotic dashed connections -->
  <line x1="98" y1="75" x2="155" y2="55" stroke="#3e6ea8" stroke-width="1" stroke-dasharray="3,5" opacity="0.28"/>
  <line x1="155" y1="55" x2="218" y2="80" stroke="#b8d4e8" stroke-width="1" stroke-dasharray="2,6" opacity="0.22"/>
  <line x1="98" y1="75" x2="78" y2="130" stroke="#3e6ea8" stroke-width="1" stroke-dasharray="3,4" opacity="0.24"/>
  <line x1="78" y1="130" x2="138" y2="115" stroke="#b8d4e8" stroke-width="0.8" stroke-dasharray="2,5" opacity="0.2"/>
  <line x1="138" y1="115" x2="208" y2="130" stroke="#3e6ea8" stroke-width="1" stroke-dasharray="3,4" opacity="0.24"/>
  <line x1="112" y1="180" x2="175" y2="196" stroke="#b8d4e8" stroke-width="1" stroke-dasharray="2,5" opacity="0.24"/>
  <line x1="175" y1="196" x2="222" y2="168" stroke="#3e6ea8" stroke-width="1" stroke-dasharray="3,5" opacity="0.2"/>
  <line x1="218" y1="80" x2="208" y2="130" stroke="#3e6ea8" stroke-width="0.8" stroke-dasharray="2,6" opacity="0.18"/>
  <line x1="98" y1="75" x2="175" y2="196" stroke="#3e6ea8" stroke-width="0.6" stroke-dasharray="2,8" opacity="0.13"/>
  <line x1="218" y1="80" x2="112" y2="180" stroke="#b8d4e8" stroke-width="0.6" stroke-dasharray="2,8" opacity="0.11"/>

  <!-- Question marks -->
  <text x="118" y="100" font-size="12" font-family="Georgia,serif" fill="#b8d4e8" opacity="0.38">?</text>
  <text x="173" y="148" font-size="10" font-family="Georgia,serif" fill="#b8d4e8" opacity="0.28">?</text>
  <text x="93" y="168" font-size="11" font-family="Georgia,serif" fill="#b8d4e8" opacity="0.32">?</text>
  <text x="196" y="108" font-size="9" font-family="Georgia,serif" fill="#b8d4e8" opacity="0.22">?</text>

  <!-- ===CENTER: Guide figure=== -->
  <circle cx="400" cy="140" r="52" fill="none" stroke="#6da88f" stroke-width="0.8" opacity="0.14"/>
  <circle cx="400" cy="140" r="68" fill="none" stroke="#6da88f" stroke-width="0.5" opacity="0.07"/>

  <!-- Person -->
  <circle cx="400" cy="92" r="16" fill="none" stroke="#6da88f" stroke-width="2.2"/>
  <circle cx="400" cy="92" r="5.5" fill="#6da88f" opacity="0.45"/>
  <line x1="400" y1="108" x2="400" y2="168" stroke="#6da88f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M400 130 C384 123 366 127 352 123" stroke="#6da88f" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M400 130 C416 123 434 127 448 123" stroke="#6da88f" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M400 168 L387 200" stroke="#6da88f" stroke-width="2" stroke-linecap="round"/>
  <path d="M400 168 L413 200" stroke="#6da88f" stroke-width="2" stroke-linecap="round"/>

  <!-- Compass above figure -->
  <circle cx="400" cy="38" r="22" fill="none" stroke="#a88443" stroke-width="1" opacity="0.42"/>
  <path d="M400 18 L404 34 L400 30 L396 34 Z" fill="#a88443" opacity="0.72"/>
  <path d="M400 58 L396 42 L400 46 L404 42 Z" fill="#6da88f" opacity="0.48"/>
  <circle cx="422" cy="38" r="2" fill="#b8d4e8" opacity="0.45"/>
  <circle cx="378" cy="38" r="2" fill="#b8d4e8" opacity="0.45"/>
  <circle cx="400" cy="38" r="3.5" fill="#a88443" opacity="0.68"/>

  <!-- Main path (confusion → clarity) -->
  <path d="M240 140 C272 118 308 162 344 140 C362 130 380 138 400 140 C420 142 438 148 466 140 C502 130 536 155 568 140"
        stroke="url(#hPath)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- ===RIGHT: Clarity zone=== -->
  <!-- Spine -->
  <line x1="640" y1="52" x2="640" y2="228" stroke="#6da88f" stroke-width="1.5" opacity="0.32"/>
  <circle cx="640" cy="52" r="4" fill="none" stroke="#6da88f" stroke-width="1.5" opacity="0.35"/>
  <circle cx="640" cy="228" r="4" fill="none" stroke="#6da88f" stroke-width="1.5" opacity="0.35"/>

  <!-- Branch 伴走 -->
  <line x1="640" y1="82" x2="722" y2="82" stroke="#6da88f" stroke-width="1.5" opacity="0.62"/>
  <circle cx="640" cy="82" r="10" fill="#6da88f" opacity="0.82" filter="url(#hGF)"/>
  <circle cx="722" cy="82" r="6" fill="#6da88f" opacity="0.68"/>
  <line x1="728" y1="82" x2="758" y2="68" stroke="#6da88f" stroke-width="1" opacity="0.42"/>
  <circle cx="758" cy="68" r="3.5" fill="#a88443" opacity="0.72"/>
  <line x1="728" y1="82" x2="758" y2="96" stroke="#b8d4e8" stroke-width="1" opacity="0.38"/>
  <circle cx="758" cy="96" r="3" fill="#b8d4e8" opacity="0.62"/>
  <text x="640" y="70" font-size="9.5" font-family="Hiragino Sans,Yu Gothic,sans-serif" fill="#6da88f" opacity="0.92" text-anchor="middle">伴走</text>

  <!-- Branch 継続 -->
  <line x1="640" y1="140" x2="732" y2="140" stroke="#6da88f" stroke-width="1.5" opacity="0.62"/>
  <circle cx="640" cy="140" r="12" fill="#6da88f" opacity="0.9" filter="url(#hGF)"/>
  <circle cx="732" cy="140" r="7" fill="#3e6ea8" opacity="0.78"/>
  <line x1="739" y1="140" x2="770" y2="125" stroke="#3e6ea8" stroke-width="1" opacity="0.48"/>
  <circle cx="770" cy="125" r="4" fill="#3e6ea8" opacity="0.68"/>
  <line x1="739" y1="140" x2="770" y2="154" stroke="#6da88f" stroke-width="1" opacity="0.48"/>
  <circle cx="770" cy="154" r="3.5" fill="#6da88f" opacity="0.68"/>
  <text x="640" y="127" font-size="10.5" font-family="Hiragino Sans,Yu Gothic,sans-serif" fill="#6da88f" opacity="0.96" text-anchor="middle">継続</text>

  <!-- Branch 再現 -->
  <line x1="640" y1="198" x2="722" y2="198" stroke="#6da88f" stroke-width="1.5" opacity="0.62"/>
  <circle cx="640" cy="198" r="10" fill="#6da88f" opacity="0.82" filter="url(#hGF)"/>
  <circle cx="722" cy="198" r="6" fill="#a88443" opacity="0.72"/>
  <line x1="728" y1="198" x2="758" y2="184" stroke="#a88443" stroke-width="1" opacity="0.42"/>
  <circle cx="758" cy="184" r="3.5" fill="#a88443" opacity="0.68"/>
  <line x1="728" y1="198" x2="758" y2="212" stroke="#6da88f" stroke-width="1" opacity="0.38"/>
  <circle cx="758" cy="212" r="3" fill="#6da88f" opacity="0.58"/>
  <text x="640" y="186" font-size="9.5" font-family="Hiragino Sans,Yu Gothic,sans-serif" fill="#6da88f" opacity="0.92" text-anchor="middle">再現</text>

  <!-- Connector path to right zone -->
  <path d="M568 140 C592 140 614 140 628 140" stroke="#6da88f" stroke-width="2" fill="none" opacity="0.58"/>
  <polygon points="624,135 633,140 624,145" fill="#6da88f" opacity="0.68"/>

  <!-- Background texture dots -->
  <g fill="white" opacity="0.05">
    <circle cx="40" cy="22" r="1.5"/>
    <circle cx="118" cy="14" r="1"/>
    <circle cx="265" cy="18" r="1.5"/>
    <circle cx="492" cy="16" r="1"/>
    <circle cx="598" cy="22" r="1.5"/>
    <circle cx="772" cy="12" r="1"/>
    <circle cx="48" cy="262" r="1.5"/>
    <circle cx="192" cy="268" r="1"/>
    <circle cx="372" cy="264" r="1.5"/>
    <circle cx="558" cy="256" r="1"/>
    <circle cx="742" cy="262" r="1.5"/>
  </g>
</svg>
