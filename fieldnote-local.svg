<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0f2218"/>
      <stop offset="100%" stop-color="#0d1b2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="58%">
      <stop offset="0%" stop-color="#a88443" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a88443" stop-opacity="0"/>
    </radialGradient>
    <filter id="gf">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="240" fill="url(#bg)"/>
  <rect width="600" height="240" fill="url(#glow)"/>

  <!-- Ground -->
  <line x1="0" y1="202" x2="600" y2="202" stroke="#6da88f" stroke-width="0.5" opacity="0.18"/>

  <!-- Rolling hills (background) -->
  <path d="M0 185 Q75 160 155 172 Q230 183 305 168 Q380 152 458 168 Q530 182 600 172 L600 240 L0 240 Z" fill="rgba(109,168,143,0.055)"/>
  <path d="M0 192 Q100 178 205 188 Q305 198 408 184 Q508 172 600 180 L600 240 L0 240 Z" fill="rgba(109,168,143,0.038)"/>

  <!-- Trees -->
  <path d="M82 162 L60 202 L104 202 Z" fill="#6da88f" opacity="0.13"/>
  <rect x="79" y="202" width="6" height="14" rx="1" fill="#6da88f" opacity="0.09"/>
  <path d="M522 152 L500 202 L544 202 Z" fill="#6da88f" opacity="0.11"/>
  <rect x="519" y="202" width="6" height="14" rx="1" fill="#6da88f" opacity="0.09"/>
  <!-- Small shrubs -->
  <ellipse cx="148" cy="200" rx="22" ry="8" fill="#6da88f" opacity="0.07"/>
  <ellipse cx="458" cy="198" rx="19" ry="7" fill="#6da88f" opacity="0.07"/>

  <!-- Person 1 (left back) -->
  <circle cx="185" cy="145" r="12" fill="none" stroke="#6da88f" stroke-width="1.8" opacity="0.58"/>
  <line x1="185" y1="157" x2="185" y2="188" stroke="#6da88f" stroke-width="2.5" stroke-linecap="round" opacity="0.58"/>
  <path d="M185 168 L170 175 M185 168 L200 175" stroke="#6da88f" stroke-width="1.5" stroke-linecap="round" opacity="0.58"/>
  <path d="M185 188 L177 205 M185 188 L193 205" stroke="#6da88f" stroke-width="1.5" stroke-linecap="round" opacity="0.48"/>

  <!-- Person 2 (left-center front) -->
  <circle cx="242" cy="138" r="13" fill="none" stroke="#b8d4e8" stroke-width="1.8" opacity="0.68"/>
  <circle cx="242" cy="138" r="5" fill="#b8d4e8" opacity="0.28"/>
  <line x1="242" y1="151" x2="242" y2="184" stroke="#b8d4e8" stroke-width="2.5" stroke-linecap="round" opacity="0.62"/>
  <path d="M242 163 L226 170 M242 163 L258 170" stroke="#b8d4e8" stroke-width="1.5" stroke-linecap="round" opacity="0.62"/>
  <path d="M242 184 L232 205 M242 184 L252 205" stroke="#b8d4e8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Person 3 (center, presenter) -->
  <circle cx="300" cy="128" r="16" fill="none" stroke="#a88443" stroke-width="2.2" opacity="0.75"/>
  <circle cx="300" cy="128" r="6.5" fill="#a88443" opacity="0.38"/>
  <line x1="300" y1="144" x2="300" y2="178" stroke="#a88443" stroke-width="3" stroke-linecap="round" opacity="0.68"/>
  <!-- Welcoming arms -->
  <path d="M300 158 L278 148 M300 158 L322 148" stroke="#a88443" stroke-width="2" stroke-linecap="round" opacity="0.68"/>
  <path d="M300 178 L289 202 M300 178 L311 202" stroke="#a88443" stroke-width="2" stroke-linecap="round" opacity="0.52"/>

  <!-- Person 4 (right-center front) -->
  <circle cx="358" cy="138" r="13" fill="none" stroke="#6da88f" stroke-width="1.8" opacity="0.68"/>
  <circle cx="358" cy="138" r="5" fill="#6da88f" opacity="0.28"/>
  <line x1="358" y1="151" x2="358" y2="184" stroke="#6da88f" stroke-width="2.5" stroke-linecap="round" opacity="0.62"/>
  <path d="M358 163 L342 170 M358 163 L374 170" stroke="#6da88f" stroke-width="1.5" stroke-linecap="round" opacity="0.62"/>
  <path d="M358 184 L348 205 M358 184 L368 205" stroke="#6da88f" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Person 5 (right back) -->
  <circle cx="415" cy="145" r="12" fill="none" stroke="#b8d4e8" stroke-width="1.8" opacity="0.58"/>
  <line x1="415" y1="157" x2="415" y2="188" stroke="#b8d4e8" stroke-width="2.5" stroke-linecap="round" opacity="0.58"/>
  <path d="M415 168 L400 175 M415 168 L430 175" stroke="#b8d4e8" stroke-width="1.5" stroke-linecap="round" opacity="0.58"/>
  <path d="M415 188 L407 205 M415 188 L423 205" stroke="#b8d4e8" stroke-width="1.5" stroke-linecap="round" opacity="0.48"/>

  <!-- Community circle (bond ring) -->
  <ellipse cx="300" cy="170" rx="138" ry="18" fill="none" stroke="#a88443" stroke-width="0.8" stroke-dasharray="5,7" opacity="0.18"/>

  <!-- Speech bubble from center person -->
  <path d="M310 112 Q342 94 365 103 Q384 112 374 128 Q364 142 344 138 Q326 134 316 126 Z"
        fill="rgba(168,132,67,0.09)" stroke="#a88443" stroke-width="0.8" opacity="0.48"/>
  <path d="M316 126 L305 118 L320 123 Z" fill="rgba(168,132,67,0.14)" opacity="0.48"/>
  <line x1="325" y1="110" x2="360" y2="110" stroke="#a88443" stroke-width="1" opacity="0.32"/>
  <line x1="325" y1="118" x2="358" y2="118" stroke="#a88443" stroke-width="1" opacity="0.26"/>
  <line x1="325" y1="126" x2="352" y2="126" stroke="#a88443" stroke-width="1" opacity="0.22"/>

  <!-- Sparkles around gathering -->
  <path d="M155 118 L156.8 124 L163 124 L158 127.5 L159.8 133.5 L155 130 L150.2 133.5 L152 127.5 L147 124 L153.2 124 Z" fill="#a88443" opacity="0.28"/>
  <path d="M452 106 L453.8 112 L460 112 L455 115.5 L456.8 121.5 L452 118 L447.2 121.5 L449 115.5 L444 112 L450.2 112 Z" fill="#6da88f" opacity="0.32"/>
  <path d="M490 145 L491 148 L494.5 148 L492 150 L492.8 153 L490 151.5 L487.2 153 L488 150 L485.5 148 L489 148 Z" fill="#b8d4e8" opacity="0.28"/>

  <!-- Label tag -->
  <rect x="20" y="14" width="48" height="18" rx="4" fill="rgba(168,132,67,0.14)" stroke="#a88443" stroke-width="0.8" opacity="0.58"/>
  <text x="44" y="27" font-size="9" font-family="Arial,sans-serif" fill="#a88443" opacity="0.78" text-anchor="middle">Area</text>
</svg>
