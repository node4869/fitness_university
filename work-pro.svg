<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14213a"/>
      <stop offset="100%" stop-color="#162b3e"/>
    </linearGradient>
    <linearGradient id="stG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8d4e8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6da88f" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="32%">
      <stop offset="0%" stop-color="#b8d4e8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#b8d4e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="gf">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="180" fill="url(#bg)"/>
  <rect width="400" height="180" fill="url(#glow)"/>

  <!-- Staircase (5 steps, bottom-left to top-right) -->
  <rect x="55"  y="132" width="58" height="18" rx="3" fill="url(#stG)" stroke="#b8d4e8" stroke-width="1" opacity="0.65"/>
  <rect x="113" y="114" width="58" height="18" rx="3" fill="url(#stG)" stroke="#b8d4e8" stroke-width="1" opacity="0.7"/>
  <rect x="171" y="96"  width="58" height="18" rx="3" fill="url(#stG)" stroke="#6da88f" stroke-width="1.2" opacity="0.75"/>
  <rect x="229" y="78"  width="58" height="18" rx="3" fill="url(#stG)" stroke="#6da88f" stroke-width="1.3" opacity="0.8"/>
  <rect x="287" y="60"  width="58" height="18" rx="3" fill="rgba(109,168,143,0.22)" stroke="#6da88f" stroke-width="1.5" opacity="0.88"/>

  <!-- Riser lines -->
  <line x1="113" y1="132" x2="113" y2="114" stroke="#b8d4e8" stroke-width="1" opacity="0.38"/>
  <line x1="171" y1="114" x2="171" y2="96"  stroke="#6da88f" stroke-width="1" opacity="0.38"/>
  <line x1="229" y1="96"  x2="229" y2="78"  stroke="#6da88f" stroke-width="1" opacity="0.38"/>
  <line x1="287" y1="78"  x2="287" y2="60"  stroke="#6da88f" stroke-width="1" opacity="0.38"/>

  <!-- Skill dots on steps -->
  <circle cx="84"  cy="128" r="4"   fill="#b8d4e8" opacity="0.48"/>
  <circle cx="142" cy="110" r="4"   fill="#6da88f" opacity="0.52"/>
  <circle cx="200" cy="92"  r="4.5" fill="#b8d4e8" opacity="0.55"/>
  <circle cx="258" cy="74"  r="5"   fill="#6da88f" opacity="0.6"/>

  <!-- Figure at top step -->
  <circle cx="316" cy="41" r="10" fill="none" stroke="#6da88f" stroke-width="2"/>
  <circle cx="316" cy="41" r="4"  fill="#6da88f" opacity="0.5"/>
  <line x1="316" y1="51"  x2="316" y2="72"  stroke="#6da88f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M316 60 L304 53 M316 60 L328 53" stroke="#6da88f" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M316 72 L308 84 M316 72 L324 84" stroke="#6da88f" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Achievement star -->
  <path d="M316 22 L318 28 L324 28 L319.5 31.5 L321.2 37.5 L316 34 L310.8 37.5 L312.5 31.5 L308 28 L314 28 Z"
        fill="#a88443" opacity="0.82" filter="url(#gf)"/>

  <!-- Arms raised (celebration) -->
  <path d="M304 53 L294 44" stroke="#6da88f" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M328 53 L338 44" stroke="#6da88f" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Progress trend line -->
  <path d="M60 158 L125 140 L188 122 L248 104 L308 86" stroke="#6da88f" stroke-width="1" stroke-dasharray="4,4" fill="none" opacity="0.22"/>

  <!-- Floating sparkles -->
  <path d="M42 78 L43.5 82.5 L48 82.5 L44.5 85.5 L45.8 90 L42 88 L38.2 90 L39.5 85.5 L36 82.5 L40.5 82.5 Z" fill="#a88443" opacity="0.3"/>
  <path d="M38 125 L39 128.5 L42.5 128.5 L40 131 L40.8 134 L38 132 L35.2 134 L36 131 L33.5 128.5 L37 128.5 Z" fill="#b8d4e8" opacity="0.28"/>

  <!-- Label -->
  <text x="22" y="22" font-size="10" font-family="Arial,sans-serif" fill="#b8d4e8" opacity="0.48" font-weight="700" letter-spacing="0.12em">Pro</text>
</svg>
