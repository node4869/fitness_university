<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#14213a"/>
      <stop offset="100%" stop-color="#1a3640"/>
    </linearGradient>
    <linearGradient id="bldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6da88f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3e6ea8" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%">
      <stop offset="0%" stop-color="#6da88f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6da88f" stop-opacity="0"/>
    </radialGradient>
    <filter id="gf">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="180" fill="url(#bg)"/>
  <rect width="400" height="180" fill="url(#glow)"/>

  <!-- Building body -->
  <rect x="148" y="55" width="104" height="100" rx="3" fill="url(#bldG)" stroke="#6da88f" stroke-width="1.5" opacity="0.68"/>
  <!-- Roof layer -->
  <rect x="158" y="46" width="84" height="12" rx="2" fill="none" stroke="#6da88f" stroke-width="1" opacity="0.45"/>
  <!-- Penthouse -->
  <rect x="186" y="36" width="28" height="14" rx="2" fill="none" stroke="#a88443" stroke-width="1" opacity="0.45"/>

  <!-- Windows grid -->
  <g fill="none" stroke="#b8d4e8" stroke-width="0.8" opacity="0.38">
    <rect x="162" y="66" width="15" height="11" rx="1"/>
    <rect x="184" y="66" width="15" height="11" rx="1"/>
    <rect x="206" y="66" width="15" height="11" rx="1"/>
    <rect x="228" y="66" width="15" height="11" rx="1"/>
    <rect x="162" y="84" width="15" height="11" rx="1"/>
    <rect x="184" y="84" width="15" height="11" rx="1"/>
    <rect x="206" y="84" width="15" height="11" rx="1"/>
    <rect x="228" y="84" width="15" height="11" rx="1"/>
    <rect x="162" y="102" width="15" height="11" rx="1"/>
    <rect x="184" y="102" width="15" height="11" rx="1"/>
    <rect x="206" y="102" width="15" height="11" rx="1"/>
    <rect x="228" y="102" width="15" height="11" rx="1"/>
  </g>

  <!-- Lit windows -->
  <rect x="162" y="66" width="15" height="11" rx="1" fill="#b8d4e8" opacity="0.14"/>
  <rect x="206" y="84" width="15" height="11" rx="1" fill="#6da88f" opacity="0.2"/>
  <rect x="228" y="66" width="15" height="11" rx="1" fill="#a88443" opacity="0.18"/>
  <rect x="184" y="102" width="15" height="11" rx="1" fill="#b8d4e8" opacity="0.14"/>

  <!-- Door -->
  <rect x="186" y="128" width="28" height="27" rx="2" fill="none" stroke="#6da88f" stroke-width="1.2" opacity="0.48"/>
  <circle cx="200" cy="143" r="2.5" fill="#a88443" opacity="0.58"/>

  <!-- Ground -->
  <line x1="75" y1="155" x2="325" y2="155" stroke="#6da88f" stroke-width="0.8" opacity="0.22"/>

  <!-- ECG pulse line -->
  <path d="M75 100 L115 100 L128 100 L138 72 L158 128 L172 82 L190 100 L218 100 L228 70 L248 130 L264 100 L325 100"
        stroke="#6da88f" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Person left (support) -->
  <circle cx="150" cy="142" r="7" fill="none" stroke="#6da88f" stroke-width="1.8" opacity="0.65"/>
  <line x1="150" y1="149" x2="150" y2="165" stroke="#6da88f" stroke-width="2" stroke-linecap="round" opacity="0.62"/>
  <path d="M150 155 L143 161 M150 155 L157 161" stroke="#6da88f" stroke-width="1.5" stroke-linecap="round" opacity="0.62"/>

  <!-- Person right (client) -->
  <circle cx="250" cy="142" r="7" fill="none" stroke="#a88443" stroke-width="1.8" opacity="0.62"/>
  <line x1="250" y1="149" x2="250" y2="165" stroke="#a88443" stroke-width="2" stroke-linecap="round" opacity="0.58"/>
  <path d="M250 155 L243 161 M250 155 L257 161" stroke="#a88443" stroke-width="1.5" stroke-linecap="round" opacity="0.58"/>

  <!-- Connection between people -->
  <path d="M157 146 Q200 136 243 146" stroke="#6da88f" stroke-width="1" stroke-dasharray="3,3" fill="none" opacity="0.32"/>

  <!-- Glow dot at midpoint of connection -->
  <circle cx="200" cy="137" r="3" fill="#6da88f" opacity="0.45" filter="url(#gf)"/>

  <!-- Label -->
  <text x="22" y="22" font-size="10" font-family="Arial,sans-serif" fill="#6da88f" opacity="0.48" font-weight="700" letter-spacing="0.12em">B2B</text>

  <!-- Corner ring decoration -->
  <circle cx="378" cy="22" r="16" fill="none" stroke="#6da88f" stroke-width="0.7" opacity="0.12"/>
  <circle cx="378" cy="22" r="10" fill="none" stroke="#6da88f" stroke-width="0.7" opacity="0.12"/>
  <circle cx="378" cy="22" r="4" fill="#6da88f" opacity="0.18"/>
</svg>
