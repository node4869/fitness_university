<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14213a"/>
      <stop offset="100%" stop-color="#1a2838"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a88443" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#a88443" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="180" fill="url(#bg)"/>
  <rect width="400" height="180" fill="url(#glow)"/>

  <!-- Blueprint grid -->
  <g stroke="rgba(184,212,232,0.058)" stroke-width="0.8">
    <line x1="0" y1="36" x2="400" y2="36"/>
    <line x1="0" y1="72" x2="400" y2="72"/>
    <line x1="0" y1="108" x2="400" y2="108"/>
    <line x1="0" y1="144" x2="400" y2="144"/>
    <line x1="50"  y1="0" x2="50"  y2="180"/>
    <line x1="100" y1="0" x2="100" y2="180"/>
    <line x1="150" y1="0" x2="150" y2="180"/>
    <line x1="200" y1="0" x2="200" y2="180"/>
    <line x1="250" y1="0" x2="250" y2="180"/>
    <line x1="300" y1="0" x2="300" y2="180"/>
    <line x1="350" y1="0" x2="350" y2="180"/>
  </g>

  <!-- Input block: 現場データ -->
  <rect x="38" y="68" width="74" height="44" rx="4" fill="none" stroke="#b8d4e8" stroke-width="1.2" opacity="0.58"/>
  <text x="75" y="86" font-size="8.5" font-family="Arial,sans-serif" fill="#b8d4e8" opacity="0.72" text-anchor="middle">現場</text>
  <text x="75" y="99" font-size="8.5" font-family="Arial,sans-serif" fill="#b8d4e8" opacity="0.72" text-anchor="middle">データ</text>

  <!-- Arrow 1 -->
  <line x1="112" y1="90" x2="147" y2="90" stroke="#6da88f" stroke-width="1.5" opacity="0.58"/>
  <polygon points="143,86 152,90 143,94" fill="#6da88f" opacity="0.58"/>

  <!-- Process block: 設計 -->
  <rect x="151" y="56" width="98" height="68" rx="4" fill="rgba(109,168,143,0.1)" stroke="#6da88f" stroke-width="1.5" opacity="0.72"/>
  <text x="200" y="75" font-size="8.5" font-family="Arial,sans-serif" fill="#6da88f" opacity="0.82" text-anchor="middle">設計</text>

  <!-- Gear icon inside process block -->
  <circle cx="200" cy="98" r="13" fill="none" stroke="#6da88f" stroke-width="1" opacity="0.38"/>
  <circle cx="200" cy="98" r="6.5" fill="none" stroke="#6da88f" stroke-width="1.2" opacity="0.55"/>
  <g transform="translate(200,98)" stroke="#6da88f" stroke-width="1" opacity="0.38">
    <rect x="-2.2" y="-15" width="4.4" height="5" rx="1"/>
    <rect x="-2.2" y="10"  width="4.4" height="5" rx="1"/>
    <rect x="-15" y="-2.2" width="5" height="4.4" rx="1"/>
    <rect x="10"  y="-2.2" width="5" height="4.4" rx="1"/>
    <line x1="-9.5" y1="-9.5" x2="-12" y2="-12"/>
    <line x1="9.5"  y1="-9.5" x2="12"  y2="-12"/>
    <line x1="-9.5" y1="9.5"  x2="-12" y2="12"/>
    <line x1="9.5"  y1="9.5"  x2="12"  y2="12"/>
  </g>

  <!-- Arrow 2 -->
  <line x1="249" y1="90" x2="284" y2="90" stroke="#6da88f" stroke-width="1.5" opacity="0.58"/>
  <polygon points="280,86 289,90 280,94" fill="#6da88f" opacity="0.58"/>

  <!-- Output block: プログラム再現 -->
  <rect x="288" y="68" width="74" height="44" rx="4" fill="rgba(168,132,67,0.1)" stroke="#a88443" stroke-width="1.2" opacity="0.68"/>
  <text x="325" y="86" font-size="8.5" font-family="Arial,sans-serif" fill="#a88443" opacity="0.78" text-anchor="middle">プログラム</text>
  <text x="325" y="99" font-size="8.5" font-family="Arial,sans-serif" fill="#a88443" opacity="0.78" text-anchor="middle">再現</text>

  <!-- Sub-branch up: 課題抽出 -->
  <line x1="200" y1="56" x2="200" y2="38" stroke="#6da88f" stroke-width="1" stroke-dasharray="3,3" opacity="0.38"/>
  <rect x="164" y="20" width="72" height="20" rx="3" fill="none" stroke="#6da88f" stroke-width="0.8" opacity="0.38"/>
  <text x="200" y="34" font-size="8" font-family="Arial,sans-serif" fill="#6da88f" opacity="0.58" text-anchor="middle">課題抽出</text>

  <!-- Sub-branch down: 効果測定 -->
  <line x1="200" y1="124" x2="200" y2="142" stroke="#6da88f" stroke-width="1" stroke-dasharray="3,3" opacity="0.38"/>
  <rect x="164" y="142" width="72" height="20" rx="3" fill="none" stroke="#6da88f" stroke-width="0.8" opacity="0.38"/>
  <text x="200" y="156" font-size="8" font-family="Arial,sans-serif" fill="#6da88f" opacity="0.58" text-anchor="middle">効果測定</text>

  <!-- Dimension lines (blueprint aesthetic) -->
  <line x1="38"  y1="168" x2="112" y2="168" stroke="#b8d4e8" stroke-width="0.5" opacity="0.18"/>
  <line x1="38"  y1="164" x2="38"  y2="172" stroke="#b8d4e8" stroke-width="0.5" opacity="0.18"/>
  <line x1="112" y1="164" x2="112" y2="172" stroke="#b8d4e8" stroke-width="0.5" opacity="0.18"/>
  <line x1="288" y1="168" x2="362" y2="168" stroke="#a88443" stroke-width="0.5" opacity="0.15"/>
  <line x1="288" y1="164" x2="288" y2="172" stroke="#a88443" stroke-width="0.5" opacity="0.15"/>
  <line x1="362" y1="164" x2="362" y2="172" stroke="#a88443" stroke-width="0.5" opacity="0.15"/>

  <!-- Label -->
  <text x="22" y="22" font-size="10" font-family="Arial,sans-serif" fill="#a88443" opacity="0.48" font-weight="700" letter-spacing="0.12em">Dev</text>
</svg>
